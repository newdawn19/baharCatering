spring:
  datasource:
    # WebSite：https://www.bahar.cn #########################
    url: "jdbc:mysql://localhost:3306/bahar-db?useUnicode=true&characterEncoding=UTF8&useSSL=false"
    username: "root"
    password: "rootAdmin@0731"
    type: "com.zaxxer.hikari.HikariDataSource"
    driverClassName: "com.mysql.cj.jdbc.Driver"
  cache:
    type: "ehcache"
    ehcache:
      config: "classpath:ehcache.xml"
  servlet:
    multipart:
      # 最大上传文件
      max-file-size: "10MB"
      max-request-size: "10MB"
  jackson:
    # 默认时间格式
    date-format: "yyyy-MM-dd HH:mm:ss"
logging:
  level:
    com:
      # 日志级别
      bahar: "info"
multipart:
  max-file-size: "20mb"
  max-request-size: "20mb"
mybatis-plus:
  # mybatis配置
  mapper-locations: "classpath*:/mapper/*.xml"
mybatis:
  configuration:
    log-impl: "org.apache.ibatis.logging.stdout.StdOutImpl"
